name = "picksharp"
main = "worker/index.js"
compatibility_date = "2024-09-15"

[observability]
enabled = true

[[routes]]
pattern = "wepicksharp.com"
custom_domain = true

[assets]
directory = "./dist/"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sharpflow-db"
# database_id intentionally omitted: Wrangler auto-provisions the D1 database
# on first deploy and writes the id back into this file.

[ai]
binding = "AI"

# SUPABASE_URL and SUPABASE_ANON_KEY are the project URL + publishable/anon key,
# both safe to commit (same values already bundled into the frontend JS).
# ADMIN_SECRET is sensitive and must be set separately in the Cloudflare dashboard:
# Worker -> Settings -> Variables and Secrets -> Add secret.
[vars]
SUPABASE_URL = "https://xnubjcrvkjxhtbkgfkaz.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_0pE2OkqdMUv2Pr0WppR_nw_8tfIMhuG"
PUBLIC_SITE_URL = "https://wepicksharp.com"
ADMIN_EMAILS = "zohnwheeler@gmail.com"
POSTING_PAUSED = "false"
AFFILIATE_LINK = "https://ak.draftkings.com"

[triggers]
# Second string's "0,15" fires props generation at :15 past 13/17/22 UTC alongside the
# existing :00 generation firings -- 13:15 and 17:15 are deliberate harmless no-ops
# (only 22:15 matches the props branch in index.js's scheduled(); the other two fall
# through to the same quiet-period check that already runs every 5 minutes). Consolidated
# into one string instead of a separate 3rd cron because Cloudflare's Workers Free plan
# caps cron triggers at 5 PER ACCOUNT (not per Worker) -- see feedback memory on this.
crons = ["1,6,11,16,21,26,31,36,41,46,51,56 * * * *", "0,15 13,17,22 * * THU,SAT,SUN"]
