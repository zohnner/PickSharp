name = "picksharp"
main = "worker/index.js"
compatibility_date = "2024-09-15"

[observability]
enabled = true

[[routes]]
pattern = "wepicksharp.com"
custom_domain = true

[assets]
directory = "./dist/"
binding = "ASSETS"
run_worker_first = ["/api/*", "/odds", "/odds/*", "/tools/*", "/sitemap.xml", "/robots.txt"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sharpflow-db"
# database_id intentionally omitted: Wrangler auto-provisions the D1 database
# on first deploy and writes the id back into this file.

[ai]
binding = "AI"

# SUPABASE_URL and SUPABASE_ANON_KEY are the project URL + publishable/anon key,
# both safe to commit (same values already bundled into the frontend JS).
# ADMIN_SECRET is sensitive and must be set separately in the Cloudflare dashboard:
# Worker -> Settings -> Variables and Secrets -> Add secret.
[vars]
SUPABASE_URL = "https://xnubjcrvkjxhtbkgfkaz.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_0pE2OkqdMUv2Pr0WppR_nw_8tfIMhuG"
PUBLIC_SITE_URL = "https://wepicksharp.com"
# Cloudflare Web Analytics token for the server-rendered /odds and /tools pages. Empty
# leaves the beacon off. Public by design (it ships in page HTML), so it's a var, not a secret.
CF_ANALYTICS_TOKEN = ""
ADMIN_EMAILS = "zohnwheeler@gmail.com"
POSTING_PAUSED = "false"
AFFILIATE_LINK = "https://ak.draftkings.com"
XAI_DISCOVERY_PAUSED = "false"
# Daily free-pick email (worker/email.js). Stays off until all four of RESEND_API_KEY and
# UNSUBSCRIBE_SECRET (secrets) plus EMAIL_FROM and EMAIL_POSTAL_ADDRESS are set.
# EMAIL_FROM must use a domain verified in Resend. EMAIL_POSTAL_ADDRESS is legally
# required (CAN-SPAM) in every email -- a PO box or registered-agent address works.
EMAIL_PAUSED = "false"
EMAIL_FROM = "PickSharp <picks@wepicksharp.com>"
XAI_DISCOVERY_BUDGET_CEILING_USD = "18"
# Edge logger (docs/superpowers/specs/2026-09-23-edge-logger-design.md). Exact "true" pauses.
EDGE_SCAN_PAUSED = "false"
# Floor credits never spent by edge scans. The AI pick pipeline no longer uses the Odds
# API (ESPN lines since 2026-09-26), so this is just a safety margin.
EDGE_SCAN_RESERVE = "30"
# Credits held back per day until the quota resets, for the daily discovery scan (3
# sports x 3 markets once the NBA starts). Closing scans must leave this much, so when credits run low they
# stop first and discovery keeps running. Was 18/day for the retired AI pipeline, which
# exceeded the whole 500-credit plan early in each cycle and blocked every scan.
EDGE_PIPELINE_CREDITS_PER_DAY = "9"
# NBA regular-season opener (YYYY-MM-DD, UTC): the NBA joins the daily discovery scan from
# this day, so preseason lines never reach the launch gate.
EDGE_NBA_START = "2026-10-20"
# Day-of-month (UTC) the Odds API's free-plan quota resets -- only a fallback. Once the
# recorded balance jumps back up, closing scans use the detected day (detectResetDay).
EDGE_QUOTA_RESET_DAY = "1"

[triggers]
# Every scheduled job checks the fire time against this one 5-minute string. The second
# string (AI pick generation + xAI discovery) was removed 2026-10-05 when AI picks were
# retired. Cloudflare's Workers Free plan caps cron triggers at 5 PER ACCOUNT (not per
# Worker) -- a 3rd string once failed to deploy with error code 10072 -- so add new jobs
# as tick checks on this string rather than new strings.
crons = ["1,6,11,16,21,26,31,36,41,46,51,56 * * * *"]
